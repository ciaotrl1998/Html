<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#263f38">
  <title>古坊奇谭</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23a74e3c'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='40' fill='%23fff4d7'%3E坊%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/boot.js"></script>
  <script defer src="js/runtime.js"></script>
</head>
<body>
  <main id="game" class="at-title">
    <section id="start-menu" class="start-menu" aria-labelledby="start-title">
      <div class="start-border" aria-hidden="true"></div>
      <header class="start-heading"><p class="start-eyebrow">一方烟火 · 一夜奇谭</p><h1 id="start-title">古坊<span>奇谭</span></h1><p class="start-subtitle">昼营百业，夜守长明。</p><span class="start-seal" aria-hidden="true">青溪<br>坊志</span></header>
      <svg class="start-landscape" viewBox="0 0 420 210" fill="none" aria-hidden="true">
        <circle cx="314" cy="47" r="24" fill="#c99e63" opacity=".3"/>
        <path d="M0 127 47 67 72 87 129 29 194 105 245 59 295 110 348 76 420 133V210H0Z" fill="#b4c1ad" opacity=".48"/>
        <path d="M0 154 63 111 113 142 174 90 236 148 299 99 365 136 420 114V210H0Z" fill="#91a48e" opacity=".38"/>
        <path d="M0 174Q86 144 176 177T420 168V210H0Z" fill="#dce1ce"/>
        <path d="M133 210Q254 180 287 205M49 196Q135 175 179 190M265 180H370" stroke="#9cac96" stroke-width="2" opacity=".5"/>
        <g stroke="#536b59" stroke-linejoin="round"><path d="M154 132H225V177H154Z" fill="#e7dcc0"/><path d="M141 134Q169 126 187 103Q206 125 239 134Z" fill="#526c5a"/><path d="M147 128Q170 117 187 99Q208 121 234 128" stroke-width="3"/><path d="M177 149H200V177H177Z" fill="#788773"/><path d="M160 145H170V155H160ZM208 145H218V155H208Z" fill="#b39c65"/>
        <path d="M88 158H139V186H88Z" fill="#e9ddbf"/><path d="M78 159 104 140H128L150 159Z" fill="#6b7f68"/><path d="M96 168H107V177H96ZM118 168H128V186H118Z" fill="#9a9e7b"/>
        <path d="M252 146H300V179H252Z" fill="#e4d8b8"/><path d="M241 146Q259 139 274 124Q288 140 311 146Z" fill="#637961"/><path d="M268 159H282V179H268Z" fill="#969c78"/>
        <path d="M57 183V129M53 152 39 139M58 143 71 130M340 181V113M340 139 324 123M341 131 357 113" stroke-width="4"/><path d="M25 140Q20 121 42 121Q30 101 54 102Q76 95 79 116Q96 133 75 144Z" fill="#7e9477" stroke="none"/><path d="M313 128Q303 111 323 107Q310 83 338 83Q361 72 367 98Q390 116 367 130Z" fill="#7b9174" stroke="none"/>
        <path d="M230 161V186M226 162H237" stroke-width="2"/><rect x="229" y="166" width="9" height="12" rx="3" fill="#ae6247" stroke="none"/></g>
        <path d="M0 204Q89 190 164 199T420 195" stroke="#879b7f" opacity=".4"/>
      </svg>
      <nav class="start-actions" aria-label="开始菜单">
        <button id="start-single" class="start-button start-primary"><span class="start-button-icon" aria-hidden="true">启</span><span>单人模式<small>新建古坊 · 开启一段故事</small></span><span class="start-arrow" aria-hidden="true">→</span></button>
        <button id="start-coop" class="start-button"><span class="start-button-icon" aria-hidden="true">伴</span><span>合作模式<small>双庄相依 · 共守长明</small></span><span class="start-arrow" aria-hidden="true">→</span></button>
        <button id="start-load" class="start-button" disabled><span class="start-button-icon" aria-hidden="true">续</span><span>读档<small id="start-save-detail">暂无本地存档</small></span><span class="start-arrow" aria-hidden="true">→</span></button>
        <button id="start-sound" class="start-button start-sound" role="switch" aria-checked="false" aria-label="音效"><span>音效<span id="start-sound-label">已关闭</span></span><i class="sound-switch" aria-hidden="true"></i></button>
      </nav>
      <footer class="start-footer"><span aria-hidden="true">◆</span> 守一座古坊，留万家灯火 <span aria-hidden="true">◆</span></footer>
    </section>
    <section id="coop-lobby" class="start-menu coop-lobby" aria-labelledby="coop-title" hidden>
      <div class="start-border" aria-hidden="true"></div>
      <header class="start-heading"><p class="start-eyebrow">两庄相邻 · 一同守夜</p><h1 id="coop-title">共守<span>古坊</span></h1><p class="start-subtitle">一墙相隔，灯火相照。</p></header>
      <div class="coop-seats">
        <div class="coop-seat is-ready"><span class="coop-avatar">主</span><strong>你<small>第一庄园 · 已就绪</small></strong><span class="coop-ready">就绪</span></div>
        <div class="coop-divider" aria-hidden="true"><span>◇</span> 同守一方烟火 <span>◇</span></div>
        <button id="coop-seat" class="coop-seat" aria-pressed="false"><span id="coop-avatar" class="coop-avatar">候</span><strong id="coop-seat-title">等待其它玩家<small>点击席位，切换为电脑</small></strong><span class="coop-seat-switch" aria-hidden="true">⇄</span></button>
      </div>
      <div class="coop-connect">
        <div class="coop-connect-actions"><button id="coop-host" class="modal-secondary">创建主机</button><button id="coop-join" class="modal-secondary">加入主机</button></div>
        <textarea id="coop-code" class="coop-code-input" rows="3" aria-label="配对码" placeholder="主机：点击「创建主机」生成邀请码；队友：粘贴邀请码后点「加入主机」" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      </div>
      <div class="coop-lobby-actions"><button id="coop-start" class="modal-primary" disabled>等待队友就绪</button><button id="coop-back" class="modal-secondary">返回开始菜单</button><p>开始新局将替换本地进度</p></div>
    </section>
    <canvas id="map" aria-label="古坊地图"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div id="invasion-indicators" hidden>
      <div class="invasion-arrow north" data-direction="0" role="img" aria-label="北方来袭" hidden><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M0 24L18 0L36 24Z"/></svg></div>
      <div class="invasion-arrow east" data-direction="1" role="img" aria-label="东方来袭" hidden><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M0 24L18 0L36 24Z"/></svg></div>
      <div class="invasion-arrow south" data-direction="2" role="img" aria-label="南方来袭" hidden><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M0 24L18 0L36 24Z"/></svg></div>
      <div class="invasion-arrow west" data-direction="3" role="img" aria-label="西方来袭" hidden><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M0 24L18 0L36 24Z"/></svg></div>
    </div>
    <header class="topbar">
      <span class="seal" aria-label="古坊奇谭">坊</span>
      <div class="resource"><i class="coin-icon" aria-hidden="true"></i><div><small>铜钱</small><strong id="coins">150</strong></div></div>
      <div class="resource"><i class="material-icon" aria-hidden="true"></i><div><small>工材</small><strong id="materials">200</strong></div></div>
    </header>
    <section class="daybar" aria-label="时间"><span id="phase-icon" aria-hidden="true">☀</span><strong id="day-label">第 1 日 · 白昼</strong><div class="day-progress"><i id="day-fill"></i></div><span id="countdown">72s</span><button id="menu-pause" aria-label="暂停并打开菜单">Ⅱ</button></section>
    <div id="autoplay-status" hidden><strong>托管中</strong><span id="autoplay-action"></span></div>
    <div id="coop-status" hidden><div class="coop-view-buttons"><button id="coop-home">我的庄园</button><button id="coop-ally">电脑庄园</button></div><span id="coop-action"></span></div>
    <div id="skills" hidden><button data-skill="repel"><i>符</i><strong>驱鬼符</strong><small>可施展</small></button><button data-skill="repair"><i>愈</i><strong>回春诀</strong><small>可施展</small></button><button data-skill="thunder"><i>雷</i><strong>九霄天雷</strong><small>可施展</small></button></div>
    <section id="panel" class="bottom-panel" hidden aria-label="建筑操作面板"><div class="panel-grip"></div><div class="panel-heading"><span id="plot-label">平地</span><button id="close-panel" aria-label="关闭建筑面板">×</button></div><div id="build-view"><div id="cards" class="cards"></div></div><div id="detail-view" hidden></div></section>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="modal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="游戏菜单" hidden><section class="modal-card"><button id="close-modal" aria-label="关闭菜单并继续">×</button><div id="modal-content"></div></section></div>
    <div id="startup-error" role="alert" hidden><strong>游戏未能启动</strong><p id="startup-error-message"></p><button onclick="location.reload()">重新加载</button></div>
    <noscript><div class="noscript">请在支持 JavaScript 的浏览器中打开游戏。</div></noscript>
  </main>
</body>
</html>
