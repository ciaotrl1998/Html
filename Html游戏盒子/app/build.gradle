plugins {
    id "com.android.application"
}

// The distributed phone APK contains one runtime. Emulator builds are isolated so
// connectedDebugAndroidTest cannot overwrite the smaller ARM64 download artifact.
def htmlboxAbi = providers.gradleProperty("htmlboxAbi").getOrElse("arm64-v8a")
if (!(htmlboxAbi in ["arm64-v8a", "armeabi-v7a", "x86_64"])) {
    throw new GradleException("Unsupported htmlboxAbi: ${htmlboxAbi}")
}
if (htmlboxAbi != "arm64-v8a") {
    layout.buildDirectory.set(file("build-${htmlboxAbi}"))
}

android {
    namespace "cn.linecode.game2048"
    compileSdk 34
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "cn.linecode.game2048"
        minSdk 24
        targetSdk 34
        versionCode 16
        versionName "2.4.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk { abiFilters htmlboxAbi }
        externalNativeBuild {
            cmake { arguments "-DANDROID_STL=c++_shared" }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    sourceSets {
        main.res.srcDir "$buildDir/generated/res/htmlboxIcon"
        main.assets.srcDir "$buildDir/generated/assets/servers"
    }
    externalNativeBuild {
        cmake { path file("CMakeLists.txt"); version "3.22.1" }
    }
    packaging {
        jniLibs {
            // Deflate the Node runtime inside the APK; Android extracts it on install.
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

def prepareHtmlBoxIcon = tasks.register("prepareHtmlBoxIcon", Copy) {
    // 应用图标来源,在工程根目录(Game2048/)下直接替换本文件即可换图标。
    from(rootProject.file("HTMLBOX_icon.jpg")) { rename { "htmlbox_icon.jpg" } }
    into layout.buildDirectory.dir("generated/res/htmlboxIcon/drawable")
    from(rootProject.file("serve.png")) { rename { "ic_serve.png" } }
}

def prepareServerAssets = tasks.register("prepareServerAssets", Sync) {
    def runtime = rootProject.file("server-runtime")
    from(runtime) { include "prelude.js", "esm-loader.mjs", "clipboard.js", "node_modules/ws/**" }
    into layout.buildDirectory.dir("generated/assets/servers/node-runtime")
    doFirst {
        if (!new File(runtime, "node_modules/ws/index.js").isFile()) {
            throw new GradleException("请先在 Game2048/server-runtime 执行 npm ci --omit=dev --omit=optional --ignore-scripts")
        }
    }
}
tasks.named("preBuild") {
    dependsOn prepareServerAssets
    doFirst {
        if (!file("build/nodejs-mobile/include/node/node.h").isFile()) {
            throw new GradleException("请先执行 node Game2048/scripts/prepare-server-runtime.js 下载内置 Node.js Mobile")
        }
    }
}

tasks.configureEach { task ->
    boolean readsResourceSources = task.name.endsWith("Resources")
            || task.name.endsWith("SourceSetPaths")
    if (readsResourceSources) {
        task.dependsOn prepareHtmlBoxIcon
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.activity:activity:1.8.2"
    implementation "androidx.documentfile:documentfile:1.0.1"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20231013"
    androidTestImplementation "androidx.test:runner:1.5.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
}

// Kotlin 1.8 起 jdk7/jdk8 的类已并入 kotlin-stdlib,
// 旧版 kotlin-stdlib-jdk7/jdk8 会与新 stdlib 产生 Duplicate class, 故排除。
configurations.configureEach {
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
}
