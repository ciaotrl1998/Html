plugins {
    id "com.android.application"
}

android {
    namespace "cn.linecode.game2048"
    compileSdk 34

    defaultConfig {
        applicationId "cn.linecode.game2048"
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName "2.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    sourceSets {
        main.res.srcDir "$buildDir/generated/res/htmlboxIcon"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

def prepareHtmlBoxIcon = tasks.register("prepareHtmlBoxIcon", Copy) {
    from rootProject.file("HTMLBOX_icon.jpg")
    into layout.buildDirectory.dir("generated/res/htmlboxIcon/drawable")
    rename { "htmlbox_icon.jpg" }
}

tasks.configureEach { task ->
    boolean readsResourceSources = task.name.endsWith("Resources")
            || task.name.endsWith("SourceSetPaths")
    if (readsResourceSources) {
        task.dependsOn prepareHtmlBoxIcon
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.activity:activity:1.8.2"
    implementation "androidx.documentfile:documentfile:1.0.1"
}

// Kotlin 1.8 起 jdk7/jdk8 的类已并入 kotlin-stdlib,
// 旧版 kotlin-stdlib-jdk7/jdk8 会与新 stdlib 产生 Duplicate class, 故排除。
configurations.configureEach {
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
}
