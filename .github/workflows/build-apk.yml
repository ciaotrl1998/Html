name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Game2048/server-runtime/package-lock.json

      - name: Install server runtime dependencies
        working-directory: Game2048/server-runtime
        run: npm ci --omit=optional --ignore-scripts

      - name: Test server bootstrap
        working-directory: Game2048/server-runtime
        run: npm test

      - name: Cache Node.js Mobile download
        uses: actions/cache@v4
        with:
          path: Game2048/.cache
          key: nodejs-mobile-android-18.20.4

      - name: Prepare embedded Node.js Mobile
        run: node Game2048/scripts/prepare-server-runtime.js

      - name: Show SDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "--- root ---"; ls "$ANDROID_SDK_ROOT" || true
          echo "--- platforms ---"; ls "$ANDROID_SDK_ROOT/platforms" || true
          echo "--- build-tools ---"; ls "$ANDROID_SDK_ROOT/build-tools" || true

      - name: Ensure SDK components (android-34)
        run: |
          SDK="$ANDROID_SDK_ROOT"
          if [ -z "$SDK" ]; then SDK="$ANDROID_HOME"; fi
          SM=""
          for c in \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/cmdline-tools/bin/sdkmanager" \
            "$(command -v sdkmanager 2>/dev/null)"; do
            if [ -n "$c" ] && [ -x "$c" ]; then SM="$c"; break; fi
          done
          echo "sdkmanager = $SM"
          if [ -z "$SM" ]; then
            echo "未找到 sdkmanager,尝试使用预装 SDK"
            exit 0
          fi
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;26.1.10909125" "cmake;3.22.1"
          echo "--- after install: platforms ---"; ls "$SDK/platforms" || true
          echo "--- after install: build-tools ---"; ls "$SDK/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        working-directory: Game2048
        run: |
          set -o pipefail
          gradle assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show failure context
        if: failure()
        run: |
          echo "########## 关键错误段 ##########"
          grep -n -B 3 -A 30 -E "What went wrong|Caused by|FAILURE:|Execution failed|Failed to|Could not|error:" Game2048/build.log || true
          echo "########## 日志末尾 120 行 ##########"
          tail -n 120 Game2048/build.log || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: html-game-box-debug-apk
          path: Game2048/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify server startup and clipboard on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: Game2048
          script: gradle connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htmlbox-android-test-reports
          path: Game2048/app/build/reports/androidTests/
          if-no-files-found: ignore
