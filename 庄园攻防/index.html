<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#263f38">
  <title>庄园攻防</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/png-interface.css">
  <script defer src="js/boot.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/runtime.js"></script>
</head>
<body>
  <main id="game" class="at-title">
    <section id="start-menu" class="start-menu" aria-labelledby="start-title">
      <div class="start-border" aria-hidden="true"></div>
      <header class="start-heading"><p class="start-eyebrow">一方烟火 · 四方争鸣</p><h1 id="start-title">庄园<span>攻防</span></h1><p class="start-subtitle">经营百业，出征守坊。</p><span class="start-seal" aria-hidden="true">青溪<br>坊志</span></header>
      <img class="start-landscape" src="assets/ui/backgrounds/title-town.png" alt="" aria-hidden="true">
      <nav class="start-actions" aria-label="开始菜单">
        <button id="start-single" class="start-button start-primary"><span class="start-button-icon" aria-hidden="true">启</span><span>单人模式<small>新建古坊 · 开启一段故事</small></span><span class="start-arrow" aria-hidden="true">→</span></button>
        <button id="start-coop" class="start-button"><span class="start-button-icon" aria-hidden="true">伴</span><span>合作模式<small>双庄相依 · 共守长明</small></span><span class="start-arrow" aria-hidden="true">→</span></button>
        <button id="start-load" class="start-button" disabled><span class="start-button-icon" aria-hidden="true">续</span><span>读档<small id="start-save-detail">暂无本地存档</small></span><span class="start-arrow" aria-hidden="true">→</span></button>
        <button id="start-sound" class="start-button start-sound" role="switch" aria-checked="false" aria-label="音效"><span>音效<span id="start-sound-label">已关闭</span></span><i class="sound-switch" aria-hidden="true"></i></button>
      </nav>
      <footer class="start-footer"><span aria-hidden="true">◆</span> 守一座古坊，留万家灯火 <span aria-hidden="true">◆</span></footer>
    </section>
    <section id="single-settings" class="start-menu game-settings" aria-labelledby="single-settings-title" hidden>
      <div class="start-border" aria-hidden="true"></div>
      <header class="start-heading"><p class="start-eyebrow">独守一坊 · 自定篇章</p><h1 id="single-settings-title">开局<span>设定</span></h1><p class="start-subtitle">择定群雄与挑战，再启古坊。</p></header>
      <div class="settings-panel">
        <fieldset class="setting-group"><legend>敌方庄园</legend><p>敌庄越多，地图与战线越大。</p><div class="setting-segments enemy-segments">
          <label><input type="radio" name="single-enemies" value="1" checked><span><strong>1</strong><small>座</small></span></label>
          <label><input type="radio" name="single-enemies" value="2"><span><strong>2</strong><small>座</small></span></label>
          <label><input type="radio" name="single-enemies" value="3"><span><strong>3</strong><small>座</small></span></label>
          <label><input type="radio" name="single-enemies" value="4"><span><strong>4</strong><small>座</small></span></label>
        </div></fieldset>
        <fieldset class="setting-group"><legend>对局难度</legend><p>选择本局挑战强度。</p><div class="setting-segments difficulty-segments">
          <label><input type="radio" name="single-difficulty" value="beginner" checked><span><strong>入门</strong></span></label>
          <label><input type="radio" name="single-difficulty" value="hard"><span><strong>困难</strong></span></label>
          <label><input type="radio" name="single-difficulty" value="extreme"><span><strong>极难</strong></span></label>
          <label><input type="radio" name="single-difficulty" value="hell"><span><strong>地狱</strong></span></label>
        </div></fieldset>
      </div>
      <div class="settings-actions"><button id="single-start" class="modal-primary">开始游戏</button><button id="single-back" class="modal-secondary">返回开始菜单</button><p>开始新局将替换本地进度</p></div>
    </section>
    <section id="coop-lobby" class="start-menu coop-lobby" aria-labelledby="coop-title" hidden>
      <div class="start-border" aria-hidden="true"></div>
      <header class="start-heading"><p class="start-eyebrow">两庄相邻 · 携手出征</p><h1 id="coop-title">共守<span>古坊</span></h1><p class="start-subtitle">一墙相隔，灯火相照。</p></header>
      <div class="coop-seats">
        <div class="coop-seat is-ready"><span class="coop-avatar">主</span><strong>你<small>第一庄园 · 已就绪</small></strong><span class="coop-ready">就绪</span></div>
        <div class="coop-divider" aria-hidden="true"><span>◇</span> 同守一方烟火 <span>◇</span></div>
        <button id="coop-seat" class="coop-seat" aria-pressed="false"><span id="coop-avatar" class="coop-avatar">候</span><strong id="coop-seat-title">等待其它玩家<small>点击席位，切换为电脑</small></strong><span class="coop-seat-switch" aria-hidden="true">⇄</span></button>
      </div>
      <div class="lobby-settings"><label class="enemy-setting" for="coop-enemies">敌方庄园<select id="coop-enemies"><option value="2">2 座</option><option value="4">4 座</option><option value="6">6 座</option></select></label><label class="enemy-setting difficulty-setting" for="coop-difficulty">对局难度<select id="coop-difficulty"><option value="beginner">入门</option><option value="hard">困难</option><option value="extreme">极难</option><option value="hell">地狱</option></select></label></div><div class="coop-connect">
        <div class="coop-connect-actions"><button id="coop-host" class="modal-secondary">创建主机</button><button id="coop-join" class="modal-secondary">加入主机</button></div>
        <input id="coop-code" class="coop-code-input" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" aria-label="六位房间号" placeholder="输入 6 位房号" autocomplete="off" spellcheck="false">
      </div>
      <div class="coop-lobby-actions"><button id="coop-start" class="modal-primary" disabled>等待队友就绪</button><button id="coop-back" class="modal-secondary">返回开始菜单</button><p>开始新局将替换本地进度</p></div>
    </section>
    <canvas id="map" aria-label="古坊地图"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <header class="topbar">
      <button id="menu-pause" class="seal" type="button" aria-label="暂停并打开菜单" aria-expanded="false" title="打开菜单">坊</button>
      <div class="resource"><i class="coin-icon" aria-hidden="true"></i><div><small>铜钱</small><strong id="coins">0</strong><span class="resource-rate" id="coins-rate">+0/秒</span></div></div>
      <div class="resource"><i class="material-icon" aria-hidden="true"></i><div><small>工材</small><strong id="materials">0</strong><span class="resource-rate" id="materials-rate">+0/秒</span></div></div>
    </header>
    <div id="autoplay-status" hidden><strong>托管中</strong><span id="autoplay-action"></span></div>
    <div id="skills" hidden><button data-skill="repel"><i>符</i><strong>驱鬼符</strong><small>可施展</small></button><button data-skill="repair"><i>愈</i><strong>回春诀</strong><small>可施展</small></button><button data-skill="thunder"><i>雷</i><strong>九霄天雷</strong><small>可施展</small></button></div>
    <section id="panel" class="bottom-panel" hidden aria-label="建筑操作面板"><div class="panel-grip"></div><div class="panel-heading"><span id="plot-label">平地</span><button id="close-panel" aria-label="关闭建筑面板">×</button></div><div id="build-view"><div id="cards" class="cards"></div></div><div id="detail-view" hidden></div></section>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="modal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="游戏菜单" hidden><section class="modal-card"><button id="close-modal" aria-label="关闭菜单并继续">×</button><div id="modal-content"></div></section></div>
    <div id="startup-error" role="alert" hidden><strong>游戏未能启动</strong><p id="startup-error-message"></p><button onclick="location.reload()">重新加载</button></div>
    <noscript><div class="noscript">请在支持 JavaScript 的浏览器中打开游戏。</div></noscript>
  </main>
</body>
</html>
