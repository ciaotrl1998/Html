#skills [data-skill="repair"] i,.skill-option[data-choice="repair"] i{background-image:var(--art-icon-repair)}
#skills [data-skill="thunder"] i,.skill-option[data-choice="thunder"] i{background-image:var(--art-icon-thunder)}
/* Keep the one-pixel end caps fixed; stretch only the PNG's inner fill. */
.health-track{background:none;border:1px solid transparent;border-image:var(--art-health-track) 1 fill stretch;height:6px;image-rendering:pixelated}.health-track i{background:none;border:0 solid transparent;border-image:var(--art-health-building) 1 fill stretch}
#toast{background:transparent;border:6px solid transparent;border-image:var(--art-panel-dark) 6 fill stretch;border-radius:0;box-shadow:none}#toast.warning{background:transparent;border-image-source:var(--art-panel-danger)}#toast.reward{background:transparent;border-image-source:var(--art-panel-primary)}
.modal-overlay{background:none}.modal-overlay:before{content:"";position:absolute;inset:0;opacity:.6;background:var(--art-dimmer) center/100% 100%;pointer-events:none}
body.night .topbar{background:transparent;border-image-source:var(--art-panel-night)}
.vignette{background:none;box-shadow:none}
@media(max-width:360px){.start-button{gap:10px}.skill-option{gap:4px 8px}.build-card .card-effect{padding:3px;font-size:10px!important}}
/* Border images add real border widths; keep the coop lobby within portrait screens. */
.coop-lobby{padding-top:clamp(20px,4vh,36px)}.coop-lobby .coop-seats{margin:12px 0}.coop-lobby .coop-seat{padding:10px}.coop-lobby .coop-divider{padding:8px}.coop-lobby .coop-connect{padding:6px 8px;margin-bottom:6px}.coop-lobby .enemy-setting{padding:4px 8px}.coop-lobby .coop-lobby-actions button{padding:10px}.coop-lobby .coop-lobby-actions p{margin-top:6px}
@media(max-height:700px){.coop-lobby{padding-top:8px;padding-bottom:6px}.coop-lobby .coop-seats{margin:4px 0}.coop-lobby .coop-seat{padding:3px 8px}.coop-lobby .coop-divider{padding:3px}.coop-lobby .coop-connect{padding:2px 6px;margin-bottom:3px}.coop-lobby .enemy-setting{padding:1px 6px}.coop-lobby .coop-lobby-actions button{padding:7px}.coop-lobby .coop-lobby-actions p{display:none}}

</style>

<script>
/* ES5 bootstrap for older Android WebViews. */
(function () {
  'use strict';
  function layout() {
    var game = document.getElementById('game');
    if (!game) return;
    var h = Math.max(1, Math.round(window.visualViewport ? window.visualViewport.height : window.innerHeight || document.documentElement.clientHeight));
    var w = Math.max(1, Math.floor(Math.min(document.documentElement.clientWidth || window.innerWidth, 480, h * 9 / 16)));
    game.style.width = w + 'px'; game.style.height = h + 'px';
  }
  function report(message) {
    var box = document.getElementById('startup-error'), label = document.getElementById('startup-error-message');
    if (box && label) { label.textContent = message; box.hidden = false; }
  }
  window.GufangBoot = { layout: layout, report: report };
  layout(); window.addEventListener('resize', layout);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);
  window.addEventListener('error', function (e) {
    if (!window.Gufang) report('加载失败：' + (e.message || '游戏脚本未能读取') + '。请用浏览器打开完整的“庄园攻防.html”文件。');
  });
  window.addEventListener('load', function () {
    if (!window.Gufang) report('游戏脚本未加载。请用浏览器打开“庄园攻防.html”单文件版本，或保留 index.html 同目录的 runtime.js 和 boot.js。');
  });
})();
